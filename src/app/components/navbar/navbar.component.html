<nav class="site-nav" [class.menu-open]="menuOpen()">
  <div class="nav-inner">
    <a class="logo" routerLink="/" (click)="closeMenu()">
      <span class="logo-mark">DD</span>
      <span class="logo-slash">/</span>
      <span class="logo-word">dev</span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen()">
      @for (link of links; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="active" (click)="closeMenu()">
            <span class="link-index">0{{ $index + 1 }}</span>
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle theme">
        @if (isDark$ | async) {
          <i class="bi bi-sun-fill"></i>
        } @else {
          <i class="bi bi-moon-stars-fill"></i>
        }
      </button>

      <button class="burger" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>
<div class="nav-scrim" [class.show]="menuOpen()" (click)="closeMenu()"></div>
